<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="Wathb app icon preview at launcher resolution">
  <!-- Adaptive icon background -->
  <rect width="108" height="108" rx="20" fill="#006D6B"/>

  <!-- Gold sun -->
  <circle cx="78" cy="28" r="12" fill="#F4B432"/>

  <!-- Leaping figure (white) — scaled to safe zone [18,18]–[90,90] -->
  <!-- Head -->
  <circle cx="48" cy="32" r="7" fill="#FFFFFF"/>
  <!-- Torso -->
  <line x1="48" y1="39" x2="54" y2="56" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Right arm (forward/raised) -->
  <line x1="50" y1="44" x2="66" y2="34" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Left arm (back) -->
  <line x1="50" y1="44" x2="36" y2="50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg (forward) -->
  <line x1="54" y1="56" x2="72" y2="64" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Left leg (trailing) -->
  <line x1="54" y1="56" x2="40" y2="70" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Wave -->
  <path d="M18,78 C28,71 40,83 52,76 C64,69 76,80 90,75 L90,92 L18,92 Z"
        fill="#0EA5A3" opacity="0.85"/>
</svg>
