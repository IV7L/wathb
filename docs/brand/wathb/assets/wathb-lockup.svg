<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img" aria-label="Wathb full lockup — symbol and wordmarks">
  <!-- Symbol (scaled 70x70, left-aligned) -->
  <g transform="translate(5,5) scale(0.70)">
    <circle cx="50" cy="50" r="50" fill="#006D6B"/>
    <circle cx="76" cy="24" r="11" fill="#F4B432"/>
    <circle cx="38" cy="28" r="6" fill="#FFFFFF"/>
    <line x1="38" y1="34" x2="43" y2="51" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="40" y1="38" x2="56" y2="28" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="38" x2="26" y2="44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="43" y1="51" x2="59" y2="57" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="43" y1="51" x2="32" y2="63" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,75 C16,67 32,82 48,74 C64,66 76,80 100,73 L100,100 L0,100 Z" fill="#0EA5A3" opacity="0.85"/>
  </g>

  <!-- Vertical divider -->
  <line x1="90" y1="12" x2="90" y2="68" stroke="#E6E0E9" stroke-width="1"/>

  <!-- Arabic wordmark -->
  <text x="215" y="38"
    font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
    font-size="36"
    font-weight="700"
    fill="#006D6B"
    text-anchor="middle"
    direction="rtl"
    unicode-bidi="embed">وَثْب</text>

  <!-- English wordmark -->
  <text x="215" y="64"
    font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
    font-size="16"
    font-weight="600"
    fill="#0EA5A3"
    text-anchor="middle"
    letter-spacing="3">WATHB</text>
</svg>
