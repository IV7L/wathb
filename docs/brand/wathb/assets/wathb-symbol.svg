<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Wathb symbol — leaping figure">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#006D6B"/>

  <!-- Gold sun (upper right) -->
  <circle cx="76" cy="24" r="11" fill="#F4B432"/>

  <!-- Leaping figure (white) -->
  <!-- Head -->
  <circle cx="38" cy="28" r="6" fill="#FFFFFF"/>
  <!-- Torso (forward-angled) -->
  <line x1="38" y1="34" x2="43" y2="51"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Right arm — raised forward -->
  <line x1="40" y1="38" x2="56" y2="28"
        stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Left arm — trailing back -->
  <line x1="40" y1="38" x2="26" y2="44"
        stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg — extending forward -->
  <line x1="43" y1="51" x2="59" y2="57"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Left leg — trailing back -->
  <line x1="43" y1="51" x2="32" y2="63"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Teal wave at base -->
  <path d="M0,75 C16,67 32,82 48,74 C64,66 76,80 100,73 L100,100 L0,100 Z"
        fill="#0EA5A3" opacity="0.85"/>
</svg>
